[project]
name = "jinn"
version = "0.4.0"
description = "Programmable Cognition System — not a chatbot"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
web = [
    "crawl4ai>=0.5.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.1",
    "Markdown>=3.7",
    "tenacity>=8.2",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
